<!doctype html>
<!-- Banner do README (1920x1080). Como regenerar: veja docs/deploy.md, "Gerar a imagem de novo". -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#0f0f16;font-family:Inter,sans-serif;color:#ececf1;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(140px);opacity:.38}
.g1{width:720px;height:520px;background:#f2b84b;left:120px;top:420px}
.g2{width:640px;height:520px;background:#4fb3a9;right:80px;top:300px}
.g3{width:620px;height:460px;background:#e07a5f;left:700px;top:620px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(236,236,241,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(236,236,241,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 75%)}
header{position:absolute;top:70px;left:0;right:0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:16px;font-weight:800;font-size:30px;letter-spacing:-.01em}
.brand img{width:48px;height:48px}
h1{margin-top:26px;font-size:76px;font-weight:800;letter-spacing:-.035em;line-height:1.02}
h1 .a{color:#f2b84b}h1 .b{color:#4fb3a9}h1 .c{color:#e07a5f}
.sub{margin-top:20px;font-size:25px;color:#a9a9b8}
.chips{margin-top:26px;display:flex;justify-content:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:17px}
.chips span{padding:7px 15px;border:1px solid #2c2c38;border-radius:999px;background:rgba(24,24,33,.8);color:#cfcfda}
.chips b{color:#f2b84b;font-weight:600}
.frame{position:absolute;left:50%;top:400px;width:1400px;transform:translateX(-50%);border-radius:18px;padding:10px;background:linear-gradient(135deg,rgba(242,184,75,.55),rgba(79,179,169,.35) 50%,rgba(224,122,95,.55));box-shadow:0 40px 120px rgba(5,5,10,.7)}
.frame img{display:block;width:100%;border-radius:10px}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="grid"></div>
<header>
  <div class="brand"><img src="../../brand-maker/src/lib/assets/favicon.svg" alt="">Brand Maker</div>
  <h1>Monte a <span class="a">marca</span>, baixe o <span class="b">kit</span>.</h1>
  <p class="sub">Identidade visual ao vivo e um kit de design que prende o agente ao padrão.</p>
  <div class="chips"><span><b>30</b> paletas</span><span><b>10</b> padrões de interface</span><span><b>7</b> acabamentos</span><span>contraste <b>AA</b> ao vivo</span><span><b>100%</b> estático</span></div>
</header>
<div class="frame"><img src="shot.png" alt=""></div>
</body></html>
