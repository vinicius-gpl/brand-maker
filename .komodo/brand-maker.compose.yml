# Brand Maker on the hetzner Swarm (Komodo Stack hetzner_brand-maker, see komodo.toml).
# APP_IMAGE comes from komodo.sh: the image the Komodo Build left on this same server.
# Caddy (config) reaches the service as hetzner_brand-maker_web:3000 over the edge network; the
# route is brand-maker.caddy, published by route.sh.
#
# Local development keeps using brand-maker/.config/docker/compose.yml.
services:
  web:
    image: ${APP_IMAGE:?}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      # start-first: the new task only takes over once healthy, so the site never goes down.
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        app: brand-maker
        server: hetzner

networks:
  edge:
    external: true
