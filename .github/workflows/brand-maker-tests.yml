# Testes do brand maker em todo PR e push na develop e na main. Quem publica é o Komodo, no
# hetzner (.komodo/komodo.toml), pelo webhook do push na main: este workflow não publica nada.
name: Tests/Brand Maker

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint, tipos, testes e e2e
    runs-on: ubuntu-latest
    # O app mora em brand-maker/ (a raiz do repositório guarda .komodo/ e docs/).
    defaults:
      run:
        working-directory: brand-maker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brand-maker/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Unitários, componentes, estado e página (Vitest) e verificador do kit (node --test),
      # com cobertura mínima de 80% em linhas, funções, ramificações e comandos.
      - run: npm run test:coverage

      # E2E contra o build de produção.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: brand-maker/playwright-report
          retention-days: 7
