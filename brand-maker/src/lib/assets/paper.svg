<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!-- Fibras de papel: ruído esticado na horizontal (frequência baixa em x, alta em y). -->
  <filter id="fibers">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.9" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .7 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#fibers)"/>
</svg>
